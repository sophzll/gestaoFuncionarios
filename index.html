<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Funcionários</title>
</head>
<body>

    <h1>Gestão de Funcionários</h1>

    <h3>Cadastro de Funcionários</h3>

    <form id="formFuncionario">

        <label for="nome">Nome:</label>
        <input type="text" id="nome" required>
        <br><br>

        <label for="idade">Idade:</label>
        <input type="number" id="idade" min="1" required>
        <br><br>

        <label for="cargo">Cargo:</label>
        <input type="text" id="cargo" required>
        <br><br>

        <label for="salario">Salário:</label>
        <input type="number" id="salario" min="0" step="0.01" required>
        <br><br>

        <button type="submit">Cadastrar</button>

    </form>

    <p id="mensagem"></p>

    <h3>Lista de Funcionários</h3>

    <table border="1" id="tabelaFuncionarios" hidden>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Cargo</th>
                <th>Salário</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody id="corpoTabela"></tbody>
    </table>
    <h3>Relatórios</h3>

        <button type="button" id="btnSalarios">Salários acima de R$ 5.000</button>
        <button type="button" id="btnMediaSalarial">Média salarial</button>
        <button type="button" id="btnCargos">Cargos únicos</button>
        <button type="button" id="btnNomes">Nomes em maiúsculo</button>

<h4>Resultado do relatório</h4>

<div id="resultadoRelatorio" aria-live="polite">
    <p>Selecione um relatório para visualizar os resultados.</p>
</div>

    <script src="script.js"></script>

</body>
</html>
