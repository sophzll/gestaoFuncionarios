<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestão de Funcionários</title>

    <!-- Bootstrap 5.3.9 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Personalização das cores -->
    <style>
        body {
            background-color: #DCE5C8;
            color: #34452A;
        }

        h1 {
            color: #34452A;
            font-weight: 700;
        }

        h3, h4 {
            color: #34452A;
        }

        .form-label {
            font-weight: 600;
            color: #34452A;
        }

        .form-control {
            background-color: #EDF2E2;
            border-color: #A8B994;
            color: #34452A;
        }

        .form-control:focus {
            background-color: #EDF2E2;
            border-color: #586B3D;
            box-shadow: 0 0 0 0.2rem rgba(88, 107, 61, 0.2);
        }

        .btn-oliva {
            background-color: #586B3D;
            border-color: #586B3D;
            color: #EDF2E2;
        }

        .btn-oliva:hover {
            background-color: #34452A;
            border-color: #34452A;
            color: #EDF2E2;
        }

        .btn-outline-oliva {
            color: #34452A;
            border-color: #586B3D;
        }

        .btn-outline-oliva:hover {
            background-color: #586B3D;
            color: #EDF2E2;
        }

        .titulo-secao {
            border-bottom: 2px solid #A8B994;
            padding-bottom: 8px;
            margin-bottom: 20px;
        }

        .table {
            --bs-table-bg: #E5ECD8;
            --bs-table-color: #34452A;
            --bs-table-striped-bg: #D4DFC0;
            --bs-table-striped-color: #34452A;
            --bs-table-hover-bg: #C6D5A8;
            --bs-table-hover-color: #34452A;
            border-color: #A8B994;
        }

        .table thead th {
            background-color: #586B3D;
            color: #EDF2E2;
        }

        .card-relatorios {
            background-color: #C6D5A8;
            border: 1px solid #A8B994;
            border-radius: 12px;
            overflow: hidden;
        }

        .card-relatorios .card-header {
            background-color: #586B3D;
            color: #EDF2E2;
            border-bottom: 1px solid #A8B994;
        }

        .resultado-relatorio {
            background-color: #E5ECD8;
            border: 1px solid #A8B994;
            border-radius: 8px;
            padding: 16px;
        }

        footer {
            background-color: #34452A;
            color: #EDF2E2;
            border-top: 3px solid #586B3D;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

    <main class="container py-4 flex-grow-1">

        <!-- Cabeçalho -->
        <header class="mb-4">
            <h1>Gestão de Funcionários</h1>
            <p class="mb-0">Sistema de gerenciamento de funcionários</p>
        </header>

        <!-- Cadastro de funcionários -->
        <section class="mb-5">

            <h3 class="titulo-secao">Cadastro de Funcionários</h3>

            <form id="formFuncionario">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label for="nome" class="form-label">Nome:</label>
                        <input type="text" id="nome" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label for="idade" class="form-label">Idade:</label>
                        <input type="number" id="idade" class="form-control" min="1" required>
                    </div>

                    <div class="col-md-6">
                        <label for="cargo" class="form-label">Cargo:</label>
                        <input type="text" id="cargo" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label for="salario" class="form-label">Salário:</label>
                        <input type="number" id="salario" class="form-control" min="0" step="0.01" required>
                    </div>

                    <div class="col-12">
                        <button type="submit" class="btn btn-oliva">
                            Cadastrar
                        </button>
                    </div>

                </div>

            </form>

            <p id="mensagem" class="mt-3" aria-live="polite"></p>

        </section>

        <!-- Lista de funcionários -->
        <section class="mb-5">

            <h3 class="titulo-secao">Lista de Funcionários</h3>

            <div class="table-responsive">

                <table class="table table-striped table-hover table-bordered align-middle" id="tabelaFuncionarios" hidden>

                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Idade</th>
                            <th>Cargo</th>
                            <th>Salário</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="corpoTabela"></tbody>

                </table>

            </div>

        </section>

        <!-- Relatórios -->
        <section class="mb-4">

            <div class="card card-relatorios shadow-sm">

                <div class="card-header py-3">
                    <h3 class="h5 mb-0">Relatórios</h3>
                </div>

                <div class="card-body">

                    <div class="d-flex flex-wrap gap-2 mb-3">

                        <button type="button" id="btnSalarios" class="btn btn-oliva">
                            Salários acima de R$ 5.000
                        </button>

                        <button type="button" id="btnMediaSalarial" class="btn btn-outline-oliva">
                            Média salarial
                        </button>

                        <button type="button" id="btnCargos" class="btn btn-outline-oliva">
                            Cargos únicos
                        </button>

                        <button type="button" id="btnNomes" class="btn btn-outline-oliva">
                            Nomes em maiúsculo
                        </button>

                    </div>

                    <hr>

                    <h4 class="h6 mt-3">Resultado do relatório</h4>

                    <div id="resultadoRelatorio" class="resultado-relatorio" aria-live="polite">
                        <p class="mb-0">Selecione um relatório para visualizar os resultados.</p>
                    </div>

                </div>

            </div>

        </section>

    </main>

    <!-- Rodapé -->
    <footer class="py-3 mt-4">

        <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">

            <p class="mb-0 fw-semibold">
                Sophia Ellen Silva Canêdo
            </p>

            <p class="mb-0">
                Gestão de Funcionários
            </p>

        </div>

    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
